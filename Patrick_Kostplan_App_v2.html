const KEY="patrick-kostplan-v2";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S)S={kcal:2600,days:1,checked:{},sel:{}};
for(const m of MEALS){if(!S.sel[m]){let r=RECIPES.find(x=>x.meal===m);S.sel[m]=r?r.name:""}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function get(m){return RECIPES.find(r=>r.meal===m&&r.name===S.sel[m])}
function scale(r){return (S.kcal*(BASE[r.meal]/2600))/r.kcal}
function q(v,u){return u==="g"?Math.round(v/5)*5:Math.round(v*100)/100}
function renderSelectors(){

  const label=document.createElement("label");label.textContent=m;wrap.appendChild(label);
  const sel=document.createElement("select");
  RECIPES.filter(r=>r.meal===m).forEach(r=>{let o=document.createElement("option");o.value=r.name;o.textContent=r.name;sel.appendChild(o)});

 })
}

 let out="";
 for(const m of MEALS){const r=get(m);if(!r)continue;let sc=scale(r),target=S.kcal*BASE[m]/2600;
  out+='<div class="meal"><div class="mh"><strong>'+m+'</strong><b>'+r.name+'</b><span>'+q(target,'x')+' kcal</span></div><div class="ings">';
  for(const i of r.ingredients)out+='<div class="ing"><span>'+i.name+'</span><span class="qty">'+q(i.qty*sc,i.unit)+' '+i.unit+'</span></div>';
  out+='</div></div>';
 }
 document.getElementById("meals").innerHTML=out;
}

function shopItems(){
 const map=new Map();
 MEALS.forEach(m=>{let r=get(m);if(!r)return;let sc=scale(r);r.ingredients.forEach(i=>{let k=key(i);if(!map.has(k))map.set(k,{name:i.name,unit:i.unit,qty:0,meals:[]});let x=map.get(k);x.qty+=i.qty*sc;if(!x.meals.includes(m))x.meals.push(m)})});
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"da"));
}
function id(x){return btoa(unescape(encodeURIComponent(key(x)))).replace(/[^A-Za-z0-9]/g,"")}
function renderShop(){
 let out="",items=shopItems();
 if(!items.length){document.getElementById("shopping").innerHTML='<div class="empty">Ingen ingredienser.</div>';return}
 items.forEach(x=>{let k=id(x),checked=!!S.checked[k];out+='<div class="shoprow"><input type="checkbox" data-k="'+k+'" '+(checked?"checked":"")+'><div class="name"><b>'+x.name+'</b><div class="muted">'+x.meals.join(", ")+'</div></div><strong>'+q(x.qty*S.days,x.unit)+' '+x.unit+'</strong></div>'});
 const box=document.getElementById("shopping");box.innerHTML=out;box.querySelectorAll("input").forEach(c=>c.onchange=()=>{S.checked[c.dataset.k]=c.checked;save()});
}
function renderAll(){document.getElementById("kcal").value=S.kcal;document.getElementById("days").value=S.days;renderSelectors();renderMetrics();renderDay();renderShop()}
document.getElementById("kcal").addEventListener("input",e=>{let v=parseInt(e.target.value,10);if(Number.isInteger(v)&&v>=1800&&v<=5000){S.kcal=v;save();renderAll()}});
document.getElementById("days").addEventListener("input",e=>{let v=parseInt(e.target.value,10);if(Number.isInteger(v)&&v>=1&&v<=365){S.days=v;save();renderShop()}});
document.getElementById("all").onclick=()=>{shopItems().forEach(x=>S.checked[id(x)]=true);save();renderShop()};
document.getElementById("none").onclick=()=>{S.checked={};save();renderShop()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.page).classList.add("active")});
renderAll();
</script></body></html>
